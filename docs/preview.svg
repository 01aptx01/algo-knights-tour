<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Knight's Tour Lab preview</title>
  <desc id="desc">A dark algorithm visualization dashboard comparing Warnsdorff's heuristic with classic backtracking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171018"/><stop offset="1" stop-color="#291c1c"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#80caff"/><stop offset="1" stop-color="#3e7eff"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb39a"/><stop offset="1" stop-color="#ff6f7e"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="90" cy="50" r="250" fill="#d758a2" opacity=".14" filter="url(#glow)"/>
  <circle cx="1320" cy="710" r="250" fill="#3d9fca" opacity=".14" filter="url(#glow)"/>
  <g fill="#fff8ef" font-family="Arial, sans-serif">
    <text x="72" y="68" font-size="24" font-weight="700">♞ Knight<tspan fill="#ffb694">/</tspan>Lab</text>
    <text x="1170" y="68" font-size="11" letter-spacing="2" fill="#d2b6a2">● CLOSED TOUR ENGINE  READY</text>
    <text x="72" y="137" font-size="12" letter-spacing="3" fill="#d2b6a2">ALGORITHM VISUALIZER · 01</text>
    <text x="72" y="207" font-size="56" font-weight="700">Make every move</text>
    <text x="72" y="266" font-size="56" font-weight="700" fill="#ffb694">matter.</text>
    <text x="72" y="306" font-size="17" fill="#d2b6a2">Watch two solvers race to complete a closed knight's tour.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="72" y="350" width="1256" height="72" rx="14" fill="#241a1b" stroke="#ffd19b" stroke-opacity=".25"/>
    <g font-family="Arial, sans-serif" font-size="10" letter-spacing="2" fill="#d2b6a2">
      <text x="96" y="376">BOARD</text><text x="96" y="400" font-size="14" letter-spacing="0" fill="#fff8ef">8 × 8</text>
      <text x="250" y="376">ANIMATION</text><text x="250" y="400" font-size="14" letter-spacing="0" fill="#fff8ef">500 ms</text>
      <text x="440" y="376">START SQUARE</text><text x="440" y="400" font-size="14" letter-spacing="0" fill="#fff8ef">D4</text>
      <text x="605" y="376">SEARCH BUDGET</text><text x="605" y="400" font-size="14" letter-spacing="0" fill="#fff8ef">80k</text>
      <text x="805" y="376">TOUR TYPE</text><text x="805" y="400" font-size="14" letter-spacing="0" fill="#fff8ef">Closed loop</text>
      <text x="1010" y="376">LOOP</text><text x="1010" y="400" font-size="14" letter-spacing="0" fill="#fff8ef">Repeat tour</text>
    </g>
    <rect x="1170" y="367" width="130" height="38" rx="9" fill="#ffd179"/><text x="1192" y="391" fill="#241a1b" font-family="Arial, sans-serif" font-size="11" font-weight="700">▶ RACE BOTH</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="72" y="454" width="610" height="240" rx="18" fill="#211b22" stroke="#80caff" stroke-opacity=".35"/>
    <rect x="718" y="454" width="610" height="240" rx="18" fill="#211b22" stroke="#ff9c87" stroke-opacity=".35"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#fff8ef">
    <text x="98" y="490" font-size="11" letter-spacing="2" fill="#80caff">● HEURISTIC</text><text x="98" y="520" font-size="24" font-weight="700">Warnsdorff's <tspan fill="#80caff">Rule</tspan></text><text x="98" y="542" font-size="12" fill="#d2b6a2">Lowest onward-degree first</text>
    <text x="744" y="490" font-size="11" letter-spacing="2" fill="#ff9c87">● BRUTE FORCE</text><text x="744" y="520" font-size="24" font-weight="700">Classic <tspan fill="#ff9c87">Backtracking</tspan></text><text x="744" y="542" font-size="12" fill="#d2b6a2">Depth-first search, natural move order</text>
  </g>
  <g transform="translate(100 560)">
    <rect width="176" height="112" rx="8" fill="#202a38" stroke="#80caff" stroke-opacity=".5"/>
    <g stroke="#80caff" stroke-opacity=".18"> <path d="M22 0v112M44 0v112M66 0v112M88 0v112M110 0v112M132 0v112M154 0v112M0 22h176M0 44h176M0 66h176M0 88h176"/> </g>
    <path d="M11 99L33 77 55 88 77 55 99 66 121 33 143 44 165 11" fill="none" stroke="url(#blue)" stroke-width="3"/><text x="78" y="82" font-size="24">♞</text>
  </g>
  <g transform="translate(746 560)">
    <rect width="176" height="112" rx="8" fill="#342426" stroke="#ff9c87" stroke-opacity=".5"/>
    <g stroke="#ff9c87" stroke-opacity=".18"> <path d="M22 0v112M44 0v112M66 0v112M88 0v112M110 0v112M132 0v112M154 0v112M0 22h176M0 44h176M0 66h176M0 88h176"/> </g>
    <path d="M11 99L33 77 55 99 77 77 99 88 121 66 143 88 165 55" fill="none" stroke="url(#coral)" stroke-width="3"/><text x="78" y="82" font-size="24">♞</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="10" letter-spacing="2" fill="#d2b6a2">
    <text x="300" y="585">ELAPSED</text><text x="300" y="613" font-size="16" letter-spacing="0" fill="#fff8ef">12.4 ms</text><text x="430" y="585">MOVES</text><text x="430" y="613" font-size="16" letter-spacing="0" fill="#fff8ef">64</text><text x="530" y="585">STATUS</text><text x="530" y="613" font-size="16" letter-spacing="0" fill="#ffd179">CLOSED ✓</text>
    <text x="946" y="585">ELAPSED</text><text x="946" y="613" font-size="16" letter-spacing="0" fill="#fff8ef">88.1 ms</text><text x="1076" y="585">MOVES</text><text x="1076" y="613" font-size="16" letter-spacing="0" fill="#fff8ef">64</text><text x="1176" y="585">STATUS</text><text x="1176" y="613" font-size="16" letter-spacing="0" fill="#ffaaa7">LIMITED</text>
  </g>
</svg>
